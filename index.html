<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hà Nội Du Lịch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="container">
    <div class="logo">HÀ NỘI DU LỊCH</div>

    <nav class="nav">
      <a href="#">Trang chủ</a>
      <a href="#">Loại xe</a>
      <a href="#">Báo giá</a>
      <a href="#">Liên hệ</a>
      <a href="#">Giới thiệu</a>
    </nav>

    <button class="btn">Đặt xe</button>
  </div>
</header>

<section class="hero">
  <img src="banner.jpg" alt="banner">
  <div class="overlay">
    <h1>Dịch vụ thuê xe chuyên nghiệp</h1>
  </div>
</section>

<section class="services container">
  <h2>Dịch vụ của chúng tôi</h2>

  <div class="grid">
    <div class="card">
      <h3>Doanh nghiệp</h3>
      <p>Lái xe chuyên nghiệp</p>
    </div>

    <div class="card">
      <h3>Đưa đón sân bay</h3>
      <p>Đúng giờ - an toàn</p>
    </div>

    <div class="card">
      <h3>VIP</h3>
      <p>Xe sang - phục vụ riêng</p>
    </div>
  </div>
</section>

<footer class="footer">
  <p>© 2026 Hà Nội Du Lịch</p>
</footer>

</body>
</html>
